<script>
/* Browser-Laufzeit für jede Szene: deterministische Partikel, Licht-Flackern,
 * Kamera-Wackeln. Alles ist eine reine Funktion der Szenenzeit t (seekable). */
function hfMulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hfFlicker(t, s) {
  return 0.78 + 0.1 * Math.sin(t * 13.1 + s) + 0.07 * Math.sin(t * 29.7 + 2.3 * s) + 0.05 * Math.sin(t * 53.3 + 1.7 * s);
}
function hfNoise(t, s) {
  return Math.sin(t * 1.7 + s) * 0.5 + Math.sin(t * 3.1 + 2 * s) * 0.3 + Math.sin(t * 7.3 + 3 * s) * 0.2;
}
function hfRamp(t, r) {
  /* r = [t0, t1, from, to] */
  if (!r) return 1;
  const k = Math.min(1, Math.max(0, (t - r[0]) / Math.max(0.001, r[1] - r[0])));
  return r[2] + (r[3] - r[2]) * k;
}

function hfMakeFx(canvas, specs, seed) {

      ctx.globalAlpha = (sp.alpha || 0.35) * near;
      ctx.lineWidth = (sp.width || 2.2) * near;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - Math.sin(ang) * len * near, y - Math.cos(ang) * len * near);
      ctx.stroke();
    }
  }

    const y0 = sp.y0 ?? H * 0.4, y1 = sp.y1 ?? H * 0.9;
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      const r = (sp.size || 520) * (0.6 + p.c * 0.8);
      const x = ((p.a * (W + 2 * r) + (sp.speed || 18) * (0.5 + p.d) * t) % (W + 2 * r)) - r;
      const y = y0 + p.b * (y1 - y0) + Math.sin(t * 0.3 + p.e * 6) * 20;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const a = (sp.alpha || 0.18) * k * (0.5 + p.e * 0.5);
      g.addColorStop(0, `rgba(${sp.rgb || "170,185,175"},${a})`);
      g.addColorStop(1, `rgba(${sp.rgb || "170,185,175"},0)`);
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
  }
  function fall(sp, ps, t, k) {
    /* Asche, Schnee, Steine */
    const sp0 = sp.speed || 120;
    const visible = Math.floor(ps.length * k);
    ctx.fillStyle = sp.color || "rgba(180,175,170,1)";
    for (let i = 0; i < visible; i++) {
      const p = ps[i];
      const v = sp0 * (0.6 + p.c * 0.8);
      const s = (sp.size || 4) * (0.5 + p.d);
      const y = ((p.b * (H + 40) + v * t) % (H + 40)) - 20;
      const x = p.a * W + Math.sin(t * (0.6 + p.e) + p.a * 20) * (sp.sway || 30);
      ctx.globalAlpha = (sp.alpha || 0.7) * (0.4 + p.d * 0.6);
      if (sp.rock) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(t * (p.e - 0.5) * 6);
        ctx.fillRect(-s, -s * 0.7, s * 2, s * 1.4);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.ellipse(x, y, s, s * 0.7, p.e * 3, 0, Math.PI * 2);
        ctx.fill();

      const p = ps[i];

      const age = (t + p.b * life) % life;
      const q = age / life;
      const x = ox + p.a * ow + Math.sin(age * 3 + p.e * 9) * 22 + (sp.drift || 30) * age;

      const g = ctx.createRadialGradient(x, y, 0, x, y, s * 4);
      g.addColorStop(0, `rgba(${sp.rgb || "255,190,90"},${a})`);
      g.addColorStop(0.3, `rgba(${sp.rgb || "255,140,40"},${a * 0.5})`);
      g.addColorStop(1, `rgba(${sp.rgb || "255,120,30"},0)`);

      const p = ps[i];
      const life = 5 + p.c * 4;
      const age = (t + p.b * life) % life;
      const q = age / life;
      const r = (sp.size || 180) * (0.4 + q * 1.4);
      const x = ox + p.a * ow + (sp.drift || 20) * age;
      const y = oy - (sp.speed || 90) * age;
      const a = Math.sin(q * Math.PI) * (sp.alpha || 0.25) * k;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${sp.rgb || "60,55,50"},${a})`);
      g.addColorStop(1, `rgba(${sp.rgb || "60,55,50"},0)`);
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
  }
  function drips(sp, ps, t, k) {
    /* Tropfen, die über eine Fläche nach unten laufen */
    const [rx, ry, rw, rh] = sp.region;
    for (let i = 0; i < ps.length * k; i++) {
      const p = ps[i];
      const life = 1.4 + p.c * 2.2;
      const age = (t + p.b * life) % life;
      const q = age / life;
      const x = rx + p.a * rw + Math.sin(q * 4 + p.e) * 4;
      const y = ry + p.d * rh * 0.3 + rh * 0.8 * q * q;
      const s = (sp.size || 5) * (0.6 + p.e * 0.6);
      ctx.globalAlpha = (sp.alpha || 0.85) * Math.sin(q * Math.PI);
      ctx.fillStyle = sp.color || "rgba(220,235,240,1)";
      ctx.beginPath();
      ctx.ellipse(x, y, s * 0.7, s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha *= 0.35;
      ctx.fillRect(x - 1, y - 40 * q, 2, 40 * q);
    }
  }
  function spray(sp, ps, t, k) {
    /* Gischt aus einem Punkt (Wassereinbruch) */
    const [ox, oy] = sp.origin;
    const dir = ((sp.dir || 0) * Math.PI) / 180;
    ctx.fillStyle = sp.color || "rgba(200,225,240,1)";
    for (let i = 0; i < ps.length * k; i++) {
      const p = ps[i];
      const life = 0.6 + p.c * 0.9;
      const age = (t + p.b * life) % life;
      const sp1 = (sp.speed || 1400) * (0.5 + p.d);
      const a = dir + (p.a - 0.5) * (sp.spread || 0.6);
      const x = ox + Math.cos(a) * sp1 * age;
      const y = oy + Math.sin(a) * sp1 * age + 900 * age * age;
      ctx.globalAlpha = (sp.alpha || 0.7) * (1 - age / life);
      const s = (sp.size || 5) * (0.5 + p.e);
      ctx.beginPath();
      ctx.arc(x, y, s, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.clearRect(0, 0, W, H);
    for (const { sp, ps } of systems) {
      const k = hfRamp(t, sp.ramp);
      if (k <= 0.001) continue;
      const fn = DRAW[sp.type];
      if (fn) fn(sp, ps, t, k);
    }
    ctx.globalAlpha = 1;
  };
}

  const shot = gsap.timeline({ paused: true });
